<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI MOVIE RECAP STUDIO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #10121b;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 760px;
      margin: auto;
    }
    header {
      text-align: center;
      padding: 25px 10px;
    }
    h1 { color: #a78bfa; font-size: 26px; }
    .panel {
      background: #1c2030;
      border: 1px solid #34394e;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      color: #d7d9e5;
    }
    input, textarea, select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #454b62;
      background: #111522;
      color: white;
      font-size: 15px;
    }
    textarea { min-height: 130px; resize: vertical; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 9px;
      background: #8058e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    .note { color: #aeb4c8; font-size: 13px; }
    #count { text-align: right; color: #aeb4c8; }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>🎬 AI MOVIE RECAP STUDIO</h1>
      <p>AI ရုပ်ရှင်ဇာတ်လမ်း ဖန်တီးရေးစတူဒီယို</p>
    </header>

    <section class="panel">
      <h2>🎥 ဇာတ်လမ်း ဖန်တီးရန်</h2>

      <label>ဇာတ်လမ်းအမည်</label>
      <input id="title" placeholder="ဇာတ်လမ်းအမည် ရေးပါ">

      <label>ဇာတ်လမ်းအကြောင်းအရာ</label>
      <textarea id="prompt" maxlength="900"
        placeholder="ဖန်တီးလိုသော ဇာတ်လမ်းအကြောင်း ရေးပါ..."></textarea>
      <div id="count">0 / 900</div>

      <label>ဗီဒီယိုအရည်အသွေး</label>
      <select id="resolution">
        <option value="720p">720p</option>
        <option value="1080p">1080p</option>
      </select>

      <label>ဗီဒီယိုပုံစံ</label>
      <select id="ratio">
        <option value="9:16">TikTok / ဖုန်းဒေါင်လိုက်</option>
        <option value="16:9">YouTube / အလျားလိုက်</option>
      </select>

      <p class="note">မှတ်ချက် — ဒီမျက်နှာပြင်က ပထမအဆင့်ပုံစံဖြစ်ပြီး ဗီဒီယိုထုတ်လုပ်မှုကို Backend နဲ့ ချိတ်ဆက်ဖို့ ကျန်ပါသေးတယ်။</p>
    </section>
  </main>

  <script>
    const promptBox = document.getElementById("prompt");
    const count = document.getElementById("count");

    promptBox.addEventListener("input", () => {
      count.textContent = [...promptBox.value].length + " / 900";
    });
  </script>
</body>
</html>
